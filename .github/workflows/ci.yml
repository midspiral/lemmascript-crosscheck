name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify packed CLI
        shell: bash
        run: |
          package_tarball="$(npm pack --pack-destination "$RUNNER_TEMP")"
          package_listing="$RUNNER_TEMP/package-contents.txt"
          tar -tf "$RUNNER_TEMP/$package_tarball" > "$package_listing"
          grep -qx 'package/dist/src/cli.js' "$package_listing"
          if grep -q '^package/dist/test/' "$package_listing"; then
            echo "Compiled tests leaked into the npm package."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/consumer"
          cd "$RUNNER_TEMP/consumer"
          npm init --yes
          npm install --no-audit --no-fund "$RUNNER_TEMP/$package_tarball"

          expected_version="$(node -p "require('./node_modules/lemmascript-crosscheck/package.json').version")"
          actual_version="$(./node_modules/.bin/lemmascript-crosscheck --version)"
          test "$actual_version" = "$expected_version"
          ./node_modules/.bin/lemmascript-crosscheck --help | grep '^Usage:' > /dev/null

  integration:
    name: Soundness regressions
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Check out LemmaScript
        uses: actions/checkout@v6
        with:
          repository: midspiral/LemmaScript
          ref: main
          path: .test-lemmascript

      - name: Install dependencies
        run: npm ci

      - name: Install LemmaScript dependencies
        run: npm ci
        working-directory: .test-lemmascript

      - name: Build LemmaScript
        run: npm run build
        working-directory: .test-lemmascript

      - name: Set up Dafny
        uses: ./.test-lemmascript/.github/actions/setup-dafny

      - name: Test with real toolchain
        run: npm run test:integration
        env:
          LEMMASCRIPT: ${{ github.workspace }}/.test-lemmascript
